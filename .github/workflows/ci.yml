name: CI

on:
  workflow_dispatch:
  push:
    branches: [ Improved, Improved-CI ]
  pull_request:
    branches: [ Improved ]

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Show Xcode and simulator info
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Show Xcode project info
        working-directory: MovieSwift
        run: |
          xcodebuild -list -project MovieSwift.xcodeproj

      - name: Build
        working-directory: MovieSwift
        run: |
          xcodebuild build \
            -project MovieSwift.xcodeproj \
            -scheme MovieSwift \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        working-directory: MovieSwift
        run: |
          xcodebuild test \
            -project MovieSwift.xcodeproj  \
            -scheme MovieSwift \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
