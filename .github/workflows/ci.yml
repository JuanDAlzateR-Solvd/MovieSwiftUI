name: CI

on:
  push:
    branches: [ Improved ]
  pull_request:
    branches: [ Improved ]

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        working-directory: MovieSwift
        run: |
          xcodebuild clean build \
            -project MovieSwift.xcodeproj \
            -scheme MovieSwift \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
